[project]
name = "open-court-analytics"
version = "0.1.0"
description = "Reproducible state court case processing analytics, NODS data governance, and responsible LLM document extraction benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "spacy>=3.8.0",
    "lifelines>=0.29.0",
    "statsmodels>=0.14.0",
    "geopandas>=1.0.0",
    "matplotlib>=3.9.0",
    "tableauhyperapi>=0.0.20027",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29.0",
    "en-core-web-sm",
    "google-genai>=3.6.1",
    "plotly>=7.1.0",
    "nbformat>=5.11.1",
    "kaleido>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
