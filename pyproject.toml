[project]
name = "open-court-analytics"
version = "0.1.0"
description = "Reproducible state court case processing analytics, NODS data governance, and responsible LLM document extraction benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "spacy>=3.8.0",
    "lifelines>=0.29.0",
    "statsmodels>=0.14.0",
    "geopandas>=1.0.0",
    "matplotlib>=3.9.0",
    "folium>=0.17.0",
    "tableauhyperapi>=0.0.20027",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
